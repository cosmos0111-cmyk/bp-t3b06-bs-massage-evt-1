<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="995" cy="720" r="90" fill="#9d174d" opacity="0.07"/>
    <circle cx="938" cy="-58" r="24" fill="#9d174d" opacity="0.11"/>
    <circle cx="84" cy="273" r="61" fill="#9d174d" opacity="0.18"/>
    <circle cx="16" cy="566" r="87" fill="#9d174d" opacity="0.17"/>
    <circle cx="483" cy="438" r="20" fill="#9d174d" opacity="0.17"/>
    <circle cx="691" cy="597" r="29" fill="#9d174d" opacity="0.20"/>
    <rect x="450" y="-6" width="87" height="51" rx="8" fill="#be185d" opacity="0.04" transform="rotate(40, 42, 341)"/>
    <rect x="1269" y="154" width="35" height="26" rx="8" fill="#be185d" opacity="0.12" transform="rotate(38, 796, 576)"/>
    <rect x="1206" y="277" width="49" height="39" rx="8" fill="#be185d" opacity="0.09" transform="rotate(10, 1013, 527)"/>
    <rect x="974" y="-63" width="54" height="82" rx="8" fill="#be185d" opacity="0.04" transform="rotate(1, 440, 711)"/>
    <rect x="1213" y="390" width="78" height="35" rx="8" fill="#be185d" opacity="0.05" transform="rotate(6, 361, 223)"/>
    <rect x="315" y="371" width="38" height="57" rx="8" fill="#be185d" opacity="0.06" transform="rotate(25, -13, 240)"/>
    <rect x="214" y="604" width="97" height="65" rx="8" fill="#be185d" opacity="0.04" transform="rotate(16, 491, 640)"/>
    <rect x="212" y="680" width="68" height="31" rx="8" fill="#be185d" opacity="0.13" transform="rotate(12, 102, 33)"/>
    <polygon points="1006,131 1034,187 978,187" fill="#9d174d" opacity="0.11"/>
    <polygon points="1286,538 1354,674 1218,674" fill="#9d174d" opacity="0.13"/>
    <polygon points="829,534 863,602 795,602" fill="#9d174d" opacity="0.11"/>
    <polygon points="986,-100 1016,-40 956,-40" fill="#9d174d" opacity="0.10"/>

  <!-- Wave at bottom -->
  <path d="M0,582 C360,606 840,558 1200,582 L1200,630 L0,630Z" fill="#9d174d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    발산 마사지 이벤트
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    발산 — 마사지
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#f472b6" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    발산 발산 마사지 이벤트 — 마사지
  </text>
</svg>